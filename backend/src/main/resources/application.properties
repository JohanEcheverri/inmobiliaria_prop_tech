spring.application.name=inmobiliaria
server.port=8080

# MariaDB es la base principal de desarrollo.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/inmobiliaria?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}
spring.datasource.username=${DB_USER:inmobiliaria}
spring.datasource.password=${DB_PASSWORD:inmobiliaria}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

# Hibernate crea/actualiza las tablas a partir de las entidades JPA durante desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# Desactivar la caché de segundo nivel para evitar conflictos con Adminer
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false

# Forzar a Hibernate a sincronizar cambios inmediatamente
spring.jpa.properties.hibernate.jdbc.batch_size=0

# Ver las consultas reales en la consola (Muy útil para detectar errores de ID)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
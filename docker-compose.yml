
services:
  db:
    image: mariadb:11.2
    container_name: inmobiliaria_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_DATABASE: inmobiliaria
      MARIADB_USER: inmobiliaria
      MARIADB_PASSWORD: inmobiliaria
      TZ: America/Bogota
    ports:
      - '8081:3306'
    volumes:
      - db_data:/var/lib/mysql

  adminer:
    image: adminer:latest
    container_name: inmobiliaria_adminer
    restart: unless-stopped
    ports:
      - '8082:8080'

volumes:
  db_data:

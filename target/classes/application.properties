spring.application.name=inmobiliaria
server.port=8080

# Configuracion de MySQL. Puedes cambiar estos valores con variables de entorno.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/inmobiliaria}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.mariadb.jdbc.Driver}

# Hibernate crea/actualiza las tablas a partir de las entidades JPA durante desarrollo.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
